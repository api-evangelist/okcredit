name: Okcredit
description: >-
  OkCredit is a mobile digital ledger (bahi khata) application for small business
  owners and merchants across India, letting shopkeepers record credit and payment
  transactions digitally, send automated collection reminders over SMS and WhatsApp,
  and share account statements with customers. The consumer-facing Android and iOS
  apps replace the traditional paper udhaar ledger; the company does not currently
  publish a public developer API, SDK, or developer portal. Added to the API
  Evangelist network as a portfolio company of Lightspeed Venture Partners.
